plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.devicefinder'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.devicefinder"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 纯原生零第三方依赖，保持百 KB 极致体积
}
